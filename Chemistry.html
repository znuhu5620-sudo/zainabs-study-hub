<p>Smallest unit of matter. Made of protons, neutrons, electrons.</p>
<hr>
<h3>Element</h3>
<p>Pure substance made of one type of atom.</p>
<hr>
<h3>Compound</h3>
<p>Two or more elements combined.</p>
