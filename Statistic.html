    <h1>📊 Statistics</h1>

    <h2>Mean</h2>
    <p>
        The mean is the average of a set of numbers.
    </p>

    <h3>Formula</h3>
    <p>
        Mean = Sum of all values ÷ Number of values
    </p>

    <h2>Example</h2>
    <p>
        Find the mean of 4, 6, 8 and 10.
    </p>

    <p>
        Mean = (4 + 6 + 8 + 10) ÷ 4
    </p>

    <p>
        <b>Answer = 7</b>
    </p>

    <h2>📝 Quick Quiz</h2>

    <p>What is the mean of 5, 10 and 15?</p>
